        '403': {$ref: '#/components/responses/CsrfRejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: fantasy_library_admin_session
      description: 管理端登录后的专用 HttpOnly Cookie，路径为 /api/admin。
    AdminCsrfHeader:
      type: apiKey
      in: header
      name: X-Admin-CSRF-Token
      description: 通过管理端 GET /api/admin/auth/csrf 获取校验值并保留响应 Cookie。
    LibrarySession:
      type: apiKey
      in: cookie
      name: fantasy_library_session
      description: 登录成功后设置的 HttpOnly 会话 Cookie。
    CsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: 通过 GET /api/auth/csrf 获取校验值并保留响应 Cookie。
  parameters:
    ForumId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Page:
      name: page
      in: query
      schema: {type: integer, format: int32, minimum: 1, default: 1}
    Size:
      name: size
      in: query
      schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}
    Category:
      name: category
      in: query
      description: 分类 slug，例如 fantasy。未知 slug 会得到空列表。
      schema:
        $ref: '#/components/schemas/FilterSlug'
    Tag:
      name: tag
      in: query
      description: 标签 slug，例如 mystery。未知 slug 会得到空列表。
      schema:
        $ref: '#/components/schemas/FilterSlug'
    Tags:
      name: tags
      in: query
      style: form
      explode: true
      description: 可重复传入标签 slug，例如 tags=mystery&tags=detective。结果必须包含所有选中标签。重复项合并，可叠加单标签、分类和关键词。
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/FilterSlug'
    Keyword:
      name: q
      in: query
      description: 对标题和简介执行不区分大小写的字面包含匹配。空白关键词会忽略。
      schema: {type: string, maxLength: 100}
  responses:
    AvatarUpdated:
      description: 当前用户资料
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Profile'}
    ForumMissing:
      description: 内容不存在或已从公开档案移除
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ForumForbidden:
      description: 非作者、非管理员或写请求未通过 CSRF 校验
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthRequired:
      description: 登录状态无效或账号名、密码不正确
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CsrfRejected:
      description: 写操作缺少有效的 CSRF 校验值
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: 请求参数不符合要求，code 为 INVALID_ARGUMENT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_ARGUMENT
            message: 请求参数不正确
            errors:
              - field: size
                message: 每页最多 100 条
    Unavailable:
      description: Oracle、应用表或社区图片存储暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: 服务器内部错误，code 为 INTERNAL_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    EditorialMediaUpload:
      type: object
      required: [url]
      properties:
        url: {type: string}
        format: {type: string, enum: [MP4, WEBM]}
    EditorialEpisodeInput:
      type: object
      required: [edition, number, title, durationSeconds]
      properties:
        edition: {type: string, enum: [EPISODE, PREVIEW]}
        number: {type: integer, minimum: 1}
        title: {type: string, maxLength: 180}
        durationSeconds: {type: integer, minimum: 1}
    EditorialPlaybackSourceInput:
      type: object
      required: [label, quality, url, format]
      properties:
        label: {type: string, maxLength: 100}
        quality: {type: string, maxLength: 40}
        url: {type: string, maxLength: 1000}
        format: {type: string, enum: [MP4, WEBM]}
    EditorialEpisode:
      allOf:
        - $ref: '#/components/schemas/EditorialEpisodeInput'
        - type: object
          required: [id, sources]
          properties:
