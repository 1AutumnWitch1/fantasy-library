openapi: 3.0.3
info:
  title: 幻想图书馆 · 馆藏 API
  version: 1.0.0
  description: 公开馆藏查询、账号、私人收藏与社区讨论。初始化 SQL 中的作品、标签与插画均为本地示例。
servers:
  - url: /
    description: 使用当前后端服务地址，Android 客户端按环境配置服务器地址。
tags:
  - name: Catalog
    description: 动漫、游戏与作品分类
  - name: Account
    description: 登录和私人书架。写请求需先获取 CSRF 校验值并携带相应 Cookie。
  - name: Community
    description: 社区档案、手稿、回复及审核
  - name: Recommendations
    description: 作品热榜、馆员荐读与个性化推荐
  - name: Administration
    description: 作品、节点、论坛及馆员账号管理，仅管理员可访问。
paths:
  /api/media/catalog/{suffix}:
    get:
      tags: [Catalog]
      operationId: downloadCatalogArtwork
      summary: 读取作品封面及插图
      parameters:
        - name: suffix
          in: path
          required: true
          schema: {type: string}
          description: 图片在该目录下的相对路径。
      responses:
        '200':
          description: 图片
          content:
            image/*:
              schema: {type: string, format: binary}
        '404':
          description: 找不到图片
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/media/site/{suffix}:
    get:
      tags: [Catalog]
      operationId: downloadSiteArtwork
      summary: 读取站点配图
      parameters:
        - name: suffix
          in: path
          required: true
          schema: {type: string}
          description: 图片在该目录下的相对路径。
      responses:
        '200':
          description: 图片
          content:
            image/*:
              schema: {type: string, format: binary}
        '404':
          description: 找不到图片
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/admin/library/media/catalog:
    post:
      tags: [Administration]
      operationId: uploadCatalogImage
      summary: 上传作品图片，最大 5 MiB
      security:
        - {AdminSession: [], AdminCsrfHeader: []}
      requestBody:
        required: true
        content:
            multipart/form-data:
              schema:
                type: object
                required: [file]
                properties:
                  file: {type: string, format: binary}
      responses:
        '201':
          description: 上传完成，返回站内媒体地址
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/EditorialMediaUpload'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '413':
          description: 上传文件超过此接口允许的大小
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/media/playback:
    post:
      tags: [Administration]
      operationId: uploadPlaybackVideo
      summary: 上传视频，使用原始视频请求体时最大 5 GiB
      security:
        - {AdminSession: [], AdminCsrfHeader: []}
      requestBody:
        required: true
        content:
            multipart/form-data:
              schema:
                type: object
                required: [file]
                properties:
                  file: {type: string, format: binary}
            application/octet-stream:
              schema: {type: string, format: binary}
      responses:
        '201':
          description: 上传完成，返回站内媒体地址
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/EditorialMediaUpload'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '413':
          description: 上传文件超过此接口允许的大小
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/works/{workId}/playback:
    get:
      tags: [Administration]
      operationId: getEditorialPlayback
      summary: 查询番剧的分集、预告和播放节点
      security:
        - {AdminSession: []}
      parameters:
        - name: workId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {type: array, items: {$ref: '#/components/schemas/EditorialEpisode'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '404': {$ref: '#/components/responses/ForumMissing'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/works/{workId}/playback/episodes:
    post:
      tags: [Administration]
      operationId: addEditorialEpisode
      summary: 添加正片分集或预告
      security:
        - {AdminSession: [], AdminCsrfHeader: []}
      parameters:
        - name: workId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditorialEpisodeInput'}
      responses:
        '201':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '404': {$ref: '#/components/responses/ForumMissing'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/works/{workId}/playback/episodes/{episodeId}:
    put:
      tags: [Administration]
      operationId: updateEditorialEpisode
      summary: 编辑分集资料
      security:
        - {AdminSession: [], AdminCsrfHeader: []}
      parameters:
        - name: workId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: episodeId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditorialEpisodeInput'}
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '404': {$ref: '#/components/responses/ForumMissing'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/works/{workId}/playback/episodes/{episodeId}/sources:
    post:
      tags: [Administration]
      operationId: addEditorialPlaybackSource
      summary: 添加播放节点
      security:
        - {AdminSession: [], AdminCsrfHeader: []}
      parameters:
        - name: workId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: episodeId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditorialPlaybackSourceInput'}
      responses:
        '201':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '404': {$ref: '#/components/responses/ForumMissing'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/works/{workId}/playback/episodes/{episodeId}/sources/{sourceId}:
    put:
      tags: [Administration]
      operationId: updateEditorialPlaybackSource
      summary: 编辑播放节点
      security:
        - {AdminSession: [], AdminCsrfHeader: []}
      parameters:
        - name: workId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: episodeId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: sourceId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditorialPlaybackSourceInput'}
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '404': {$ref: '#/components/responses/ForumMissing'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/works:
    get:
      tags: [Administration]
      operationId: adminWorks
      summary: 按类型搜索作品，包含已下架记录
      security:
        - AdminSession: []
      parameters:
        - name: type
          in: query
          required: true
          schema: {type: string, enum: [ANIME, GAME]}
        - name: listed
          in: query
          schema: {type: boolean}
        - name: q
          in: query
          schema: {type: string, maxLength: 80}
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 30, default: 12}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/AdminWorkPage'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [Administration]
      operationId: createEditorialWork
      summary: 创建待上架作品
      security:
        - AdminSession: []
          AdminCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditorialDraft'}
      responses:
        '201':
          description: 请求完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/EditorialCreated'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '409':
          description: 作品标识重复或游戏平台仍关联下载节点
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/work-options:
    get:
      tags: [Administration]
      operationId: editorialOptions
      summary: 查询作品分类、标签及平台选项
      security:
        - AdminSession: []
      responses:
        '200':
          description: 请求完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/EditorialOptions'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/works/{id}:
    delete:
      tags: [Administration]
      operationId: adminDeleteWork
      summary: 永久删除作品及 Oracle 关联资料，排队清理独占站内文件
      security:
        - AdminSession: []
          AdminCsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ForumId'
      responses:
        '200':
          description: 作品已删除或已不存在
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: {type: string, enum: [OK]}
                  message: {type: string}
                  data:
                    type: object
                    required: [queuedFiles, sharedFiles]
                    properties:
                      queuedFiles: {type: integer, minimum: 0}
                      sharedFiles: {type: integer, minimum: 0}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/works/{id}/details:
    get:
      tags: [Administration]
      operationId: getEditorialWork
      summary: 读取作品编辑详情，包含下架作品
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/ForumId'
      responses:
        '200':
          description: 请求完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/EditorialArchive'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '404':
          description: 作品未找到
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [Administration]
      operationId: updateEditorialWork
      summary: 更新作品资料、封面及插图
      security:
        - AdminSession: []
          AdminCsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ForumId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditorialDraft'}
      responses:
        '200':
          description: 请求完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/EditorialCreated'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '404':
          description: 作品未找到
        '409':
          description: 作品标识重复或游戏平台仍关联下载节点
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/works/{id}/nodes:
    get:
      tags: [Administration]
      operationId: adminWorkNodes
      summary: 列出作品的播放或下载节点
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/ForumId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/AdminNodes'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/works/{id}/publication:
    put:
      tags: [Administration]
      operationId: adminPublishWork
      summary: 设置作品公开状态
      security:
        - AdminSession: []
          AdminCsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ForumId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPublication'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/ForumMissing'}
  /api/admin/library/nodes/{kind}/{id}/publication:
    put:
      tags: [Administration]
      operationId: adminPublishNode
      summary: 上架资源或确认永久下架和删除资源
      security:
        - AdminSession: []
          AdminCsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ForumId'
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [PLAYBACK, DOWNLOAD]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listed]
              properties:
                listed: {type: boolean}
                confirmRemoval:
                  type: boolean
                  description: 下架时必须显式确认永久删除 Oracle 资源记录和独占的站内对象
      responses:
        '200':
          description: 资源已上架、已删除、仍有共享文件，或文件正在等待重试清理
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: {type: string, enum: [OK]}
                  message: {type: string}
                  data:
                    type: string
                    enum: [PUBLISHED, REMOVED, SHARED_FILE_RETAINED, CLEANUP_PENDING]
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/ForumMissing'}
  /api/admin/library/forum:
    get:
      tags: [Administration]
      operationId: adminForumStatus
      summary: 读取社区论坛开放状态
      security:
        - AdminSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/AdminForum'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [Administration]
      operationId: adminSetForum
      summary: 开放或暂停公开论坛
      security:
        - AdminSession: []
          AdminCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminForum'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/posts:
    get:
      tags: [Administration]
      operationId: adminPosts
      summary: 搜索帖子，包含已下架记录
      security:
        - AdminSession: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 80}
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 30, default: 12}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/AdminPostPage'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/posts/{id}/publication:
    put:
      tags: [Administration]
      operationId: adminPublishPost
      summary: 下架或恢复论坛帖子
      security:
        - AdminSession: []
          AdminCsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ForumId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPublication'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/ForumMissing'}
  /api/admin/library/comments:
    get:
      tags: [Administration]
      operationId: adminComments
      summary: 搜索番剧或社区评论
      security:
        - AdminSession: []
      parameters:
        - name: scope
          in: query
          schema: {type: string, enum: [SCREENING, COMMUNITY]}
        - name: q
          in: query
          schema: {type: string, maxLength: 80}
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 30, default: 12}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/AdminCommentPage'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/admin/library/comments/{id}:
    delete:
      tags: [Administration]
      operationId: adminDeleteComment
      summary: 移除评论
      security:
        - AdminSession: []
          AdminCsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ForumId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ForumForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/ForumMissing'}
  /api/admin/library/members:
    get:
      tags: [Administration]
      operationId: adminMembers
      summary: 搜索未注销的用户
      security:
        - AdminSession: []
      parameters:
