          description: 封面在前，其余图片按 sortOrder 升序排列。
          items:
            $ref: '#/components/schemas/Image'
        anime:
          $ref: '#/components/schemas/AnimeInfo'
        game:
          $ref: '#/components/schemas/GameInfo'
    PageInfo:
      type: object
      required: [page, size, total, totalPages]
      properties:
        page: {type: integer, format: int32, minimum: 1}
        size: {type: integer, format: int32, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, format: int64, minimum: 0}
    AnimePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AnimeItem'
    GamePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GameItem'
    CategoryResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Category'
    AnimePageResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AnimePage'
    GamePageResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/GamePage'
    WorkDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/WorkDetail'
